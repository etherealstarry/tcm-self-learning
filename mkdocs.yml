site_name: 中医自学指南
site_url: https://etherealstarry.github.io/tcm-self-learning/
site_author: EtherealStarry
site_description: 基于北京中医药大学培养方案的中医专业自学指南，仿照 CS 自学指南风格，为中医专业学生提供系统的学习路径与资源。
repo_url: https://github.com/etherealstarry/tcm-self-learning
repo_name: etherealstarry/tcm-self-learning
edit_uri: edit/main/docs/

copyright: Copyright © 2024-present EtherealStarry

theme:
  name: material
  language: zh
  icon:
    logo: material/flower
    repo: fontawesome/brands/github
  palette:
    # 中医风格配色：朱砂红 + 药草绿
    - scheme: default
      primary: red
      accent: green
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: red
      accent: green
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/etherealstarry
      name: EtherealStarry on GitHub
  analytics:
    provider: false

extra_css:
  - assets/css/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - tags

# 导航结构（必须显式声明，否则页面 404）
nav:
  - 首页: index.md
  - 使用指南: 使用指南.md
  - 学习规划: 学习规划.md
  - 必修课程:
      - 中医基础:
          - 必修课程/中医基础/index.md
          - 必修课程/中医基础/中医基础学.md
          - 必修课程/中医基础/中医诊断学.md
      - 中药方剂:
          - 必修课程/中药方剂/index.md
          - 必修课程/中药方剂/中药学.md
          - 必修课程/中药方剂/方剂学.md
      - 中医经典:
          - 必修课程/中医经典/index.md
          - 必修课程/中医经典/黄帝内经研读指南.md
          - 必修课程/中医经典/伤寒论研读指南.md
          - 必修课程/中医经典/金匮要略研读指南.md
          - 必修课程/中医经典/温病条辨研读指南.md
      - 临床课程:
          - 必修课程/临床课程/index.md
          - 必修课程/临床课程/中医内科学.md
          - 必修课程/临床课程/中医外科学.md
          - 必修课程/临床课程/中医妇科学.md
          - 必修课程/临床课程/中医儿科学.md
      - 针灸推拿:
          - 必修课程/针灸推拿/index.md
          - 必修课程/针灸推拿/经络腧穴学.md
          - 必修课程/针灸推拿/针灸治疗学.md
          - 必修课程/针灸推拿/推拿学.md
  - 西医基础:
      - 西医基础/index.md
  - 拓展资源:
      - 拓展资源/index.md
  - 学习工具:
      - 学习工具/index.md
  - 好书推荐:
      - 好书推荐/index.md
  - 研究方向:
      - 研究方向/index.md
  - 后记: 后记.md
